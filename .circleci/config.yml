version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:16  # Using a Node image, you can change if needed
    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: Install Hadolint
          command: |
            wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x hadolint
            ./hadolint Dockerfile

      - run:
          name: Build and Push Docker Image
          environment:
            GH_PACKAGES_TOKEN: << pipeline.parameters.GH_PACKAGES_TOKEN >>
          command: |
            bash build_push_image_karsajobs_ui.sh

workflows:
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              only: karsajobs-ui
